<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Art — Sophia Zeglis</title>
  <link rel="stylesheet" href="main.css">
  <style>
    .art-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      align-items: start;
      gap: 1.25rem;
      padding: 0 1rem;
      max-width: 1400px;
      margin: 0 auto 4rem;
    }

    .art-piece {
      min-width: 0;
    }

    .art-piece button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }

    .art-piece img {
      width: 100%;
      height: auto;
      display: block;
    }

    .art-piece::after {
      content: attr(data-title) "\A" "Mixed-media collage. · " attr(data-date);
      display: block;
      margin-top: 0.45rem;
      color: #6c757d;
      font-size: 0.8rem;
      text-align: right;
      white-space: pre-line;
    }

    .art-piece button:focus-visible {
      outline: 2px solid #343a40;
      outline-offset: 4px;
    }

    .art-piece--small button {
      width: 75%;
      margin-left: auto;
      margin-right: auto;
    }

    .gallery-instruction {
      margin: 0 1rem 0.75rem;
      color: #6c757d;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-align: right;
      text-transform: uppercase;
    }

    .lightbox {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: rgba(255, 255, 255, 0.96);
    }

    .lightbox::backdrop {
      background: rgba(255, 255, 255, 0.96);
    }

    .lightbox-inner {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 4rem 3rem 3rem;
      box-sizing: border-box;
      touch-action: none;
      cursor: grab;
    }

    .lightbox img {
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)) scale(var(--zoom, 1));
      transform-origin: center;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
    }

    .lightbox-close {
      position: fixed;
      top: 1rem;
      right: 1rem;
      border: 0;
      background: transparent;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
    }

    .lightbox-help {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #6c757d;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .art-gallery {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 0 0.5rem;
      }

      .lightbox-inner {
        padding: 4rem 1rem 1rem;
      }

    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="site-header">
    <h2>Sophia Zeglis</h2>
    <nav>
      <a href="index.html">home</a> / <a href="writings.html">writings</a> / <a href="readings.html">readings</a>
    </nav>
  </div>

  <!-- Section Header -->
  <div class="section-bar bar-subtle">
    <hr style="margin: 2.5rem 0 0.75rem 0;">
    <h6></h6>
  </div>

  <main class="art-gallery">
    <div class="art-piece" data-title="Scrap Collector" data-date="June 2026">

    <div class="art-piece" data-title="All Things Fall" data-date="Spring 2026">

        <img src="images/art/jpeg/thumbs/all-things-fall.jpg" width="1000" height="606" alt="All Things Fall" loading="lazy" decoding="async">
      </button>
    </div>
    <div class="art-piece" data-title="Faucet Castle Fire Escape" data-date="Spring 2026">
      <button type="button" data-full="images/art/jpeg/full/faucet-castle-fire-escape.jpg" aria-label="Expand Faucet Castle Fire Escape">
        <img src="images/art/jpeg/thumbs/faucet-castle-fire-escape.jpg" width="1000" height="607" alt="Faucet Castle Fire Escape" loading="lazy" decoding="async">
      </button>
    </div>
    <div class="art-piece" data-title="Hand Throwing Fire and Tassel Hair" data-date="Spring 2026">
      <button type="button" data-full="images/art/jpeg/full/hand-throwing-fire-and-tassel-hair.jpg" aria-label="Expand Hand Throwing Fire and Tassel Hair">
        <img src="images/art/jpeg/thumbs/hand-throwing-fire-and-tassel-hair.jpg" width="1000" height="606" alt="Hand Throwing Fire and Tassel Hair" loading="lazy" decoding="async">

    <div class="art-piece" data-title="Skylines and Blue Boat and Roads" data-date="Spring 2026">
      <button type="button" data-full="images/art/jpeg/full/skylines-blue-boat-roads.jpg" aria-label="Expand Skylines and Blue Boat and Roads">
        <img src="images/art/jpeg/thumbs/skylines-blue-boat-roads.jpg" width="1000" height="678" alt="Skylines and Blue Boat and Roads" loading="lazy" decoding="async">

        <img src="images/art/jpeg/thumbs/the-enduring-horizon.jpg" width="1000" height="775" alt="The Enduring Horizon" loading="lazy" decoding="async">

      <button type="button" data-full="images/art/jpeg/full/drive.jpg" aria-label="Expand Drive">
        <img src="images/art/jpeg/thumbs/drive.jpg" width="1000" height="931" alt="Drive" loading="lazy" decoding="async">
      </button>
    </div>
    <div class="art-piece" data-title="Gallery" data-date="2025">
      <button type="button" data-full="images/art/jpeg/full/gallery.jpg" aria-label="Expand Gallery">
        <img src="images/art/jpeg/thumbs/gallery.jpg" width="1000" height="607" alt="Gallery" loading="lazy" decoding="async">
      </button>
    </div>
    <div class="art-piece" data-title="Greyscale Red" data-date="2025">
      <button type="button" data-full="images/art/jpeg/full/greyscale-red.jpg" aria-label="Expand Greyscale Red">
        <img src="images/art/jpeg/thumbs/greyscale-red.jpg" width="1000" height="607" alt="Greyscale Red" loading="lazy" decoding="async">
      </button>
    </div>
    <div class="art-piece art-piece--small" data-title="Heart I Know" data-date="2025">
      <button type="button" data-full="images/art/jpeg/full/heart-i-know.jpg" aria-label="Expand Heart I Know">
        <img src="images/art/jpeg/thumbs/heart-i-know.jpg" width="736" height="1000" alt="Heart I Know" loading="lazy" decoding="async">
      </button>
    </div>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Expanded artwork">
    <div class="lightbox-help">Pinch or scroll to zoom · Drag to move</div>
    <button class="lightbox-close" type="button" aria-label="Close expanded artwork">×</button>
    <div class="lightbox-inner">
      <img src="" alt="">
    </div>
  </dialog>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = lightbox.querySelector('img');
    const closeButton = lightbox.querySelector('.lightbox-close');
    const lightboxStage = lightbox.querySelector('.lightbox-inner');
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let pinchStartDistance = 0;
    let pinchStartZoom = 1;
    let pinchStartPanX = 0;
    let pinchStartPanY = 0;
    let pinchStartMidpoint = null;
    let dragStart = null;
    let fittedWidth = 0;
    let fittedHeight = 0;
    let availableWidth = 0;
    let availableHeight = 0;

    function panLimits() {
      const scaledWidth = fittedWidth * zoom;
      const scaledHeight = fittedHeight * zoom;
      return {
        // If an artwork is smaller than the stage on one axis, let it move
        // through the empty letterbox space instead of locking that axis.
        // If it is larger, use the same value as the normal overflow bound.
        x: Math.abs(scaledWidth - availableWidth) / 2,
        y: Math.abs(scaledHeight - availableHeight) / 2
      };
    }

    function setPan(x, y) {
      const limits = panLimits();
      panX = Math.min(limits.x, Math.max(-limits.x, x));
      panY = Math.min(limits.y, Math.max(-limits.y, y));
      lightboxImage.style.setProperty('--pan-x', `${panX}px`);
      lightboxImage.style.setProperty('--pan-y', `${panY}px`);
    }

    function setZoom(nextZoom) {
      zoom = Math.min(3, Math.max(0.65, nextZoom));
      lightboxImage.style.setProperty('--zoom', zoom);
      if (zoom <= 1) {
        setPan(0, 0);
      } else {
        setPan(panX, panY);
      }
    }

    function fitImage() {
      if (!lightboxImage.naturalWidth || !lightboxImage.naturalHeight) return;
      const style = getComputedStyle(lightboxStage);
      availableWidth = lightboxStage.clientWidth
        - parseFloat(style.paddingLeft)
        - parseFloat(style.paddingRight);
      availableHeight = lightboxStage.clientHeight
        - parseFloat(style.paddingTop)
        - parseFloat(style.paddingBottom);
      const fit = Math.min(
        availableWidth / lightboxImage.naturalWidth,
        availableHeight / lightboxImage.naturalHeight
      );
      fittedWidth = lightboxImage.naturalWidth * fit;
      fittedHeight = lightboxImage.naturalHeight * fit;
      lightboxImage.style.width = `${fittedWidth}px`;
      lightboxImage.style.height = `${fittedHeight}px`;
      resetView();
    }

    function resetView() {
      setPan(0, 0);
      setZoom(1);
      pinchStartDistance = 0;
      pinchStartMidpoint = null;
      dragStart = null;
    }

    function touchDistance(first, second) {
      return Math.hypot(second.clientX - first.clientX, second.clientY - first.clientY);
    }

    function touchMidpoint(first, second) {
      return {
        x: (first.clientX + second.clientX) / 2,
        y: (first.clientY + second.clientY) / 2
      };
    }

    function zoomAround(nextZoom, screenX, screenY) {
      const rect = lightboxStage.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const oldZoom = zoom;
      const imageX = (screenX - centerX - panX) / oldZoom;
      const imageY = (screenY - centerY - panY) / oldZoom;
      setZoom(nextZoom);
      if (zoom > 1) {
        setPan(
          screenX - centerX - imageX * zoom,
          screenY - centerY - imageY * zoom
        );
      }
    }

    document.querySelectorAll('.art-piece button').forEach(button => {
      button.addEventListener('click', () => {
        const thumbnail = button.querySelector('img');
        lightboxImage.src = button.dataset.full;
        lightboxImage.alt = thumbnail.alt;
        lightbox.showModal();
        requestAnimationFrame(fitImage);
      });
    });

    lightboxImage.addEventListener('load', fitImage);
    window.addEventListener('resize', () => {
      if (lightbox.open) fitImage();
    });

    lightboxStage.addEventListener('touchstart', event => {
      if (event.touches.length === 2) {
        const first = event.touches[0];
        const second = event.touches[1];
        pinchStartDistance = touchDistance(first, second);
        pinchStartZoom = zoom;
        pinchStartPanX = panX;
        pinchStartPanY = panY;
        pinchStartMidpoint = touchMidpoint(first, second);
        dragStart = null;
      } else if (event.touches.length === 1) {
        const touch = event.touches[0];
        dragStart = { x: touch.clientX - panX, y: touch.clientY - panY };
      }
    }, { passive: false });

    lightboxStage.addEventListener('touchmove', event => {
      event.preventDefault();
      if (event.touches.length === 2 && pinchStartDistance && pinchStartMidpoint) {
        const first = event.touches[0];
        const second = event.touches[1];
        const midpoint = touchMidpoint(first, second);
        const nextZoom = pinchStartZoom * (touchDistance(first, second) / pinchStartDistance);
        const rect = lightboxStage.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const imageX = (pinchStartMidpoint.x - centerX - pinchStartPanX) / pinchStartZoom;
        const imageY = (pinchStartMidpoint.y - centerY - pinchStartPanY) / pinchStartZoom;
        setZoom(nextZoom);
        if (zoom > 1) {
          setPan(
            midpoint.x - centerX - imageX * zoom,
            midpoint.y - centerY - imageY * zoom
          );
        }
      } else if (event.touches.length === 1 && dragStart && zoom > 1) {
        const touch = event.touches[0];
        setPan(touch.clientX - dragStart.x, touch.clientY - dragStart.y);
      }
    }, { passive: false });

    lightboxStage.addEventListener('touchend', event => {
      pinchStartDistance = 0;
      pinchStartMidpoint = null;
      if (event.touches.length === 1) {
        const touch = event.touches[0];
        dragStart = { x: touch.clientX - panX, y: touch.clientY - panY };
      } else {
        dragStart = null;
      }
    });

    lightboxStage.addEventListener('wheel', event => {
      event.preventDefault();
      const factor = Math.exp(-event.deltaY * 0.002);
      zoomAround(zoom * factor, event.clientX, event.clientY);
    }, { passive: false });

    lightboxStage.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'mouse') return;
      lightboxStage.setPointerCapture(event.pointerId);
      dragStart = { x: event.clientX - panX, y: event.clientY - panY };
    });

    lightboxStage.addEventListener('pointermove', event => {
      if (event.pointerType === 'mouse' && dragStart && zoom > 1) {
        setPan(event.clientX - dragStart.x, event.clientY - dragStart.y);
      }
    });

    lightboxStage.addEventListener('pointerup', () => { dragStart = null; });
    lightboxStage.addEventListener('pointercancel', () => { dragStart = null; });
    lightboxStage.addEventListener('dblclick', resetView);
    closeButton.addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) lightbox.close();
    });
  </script>

  <hr>

  <!-- Footer -->
  <div class="content-block text-muted">
    <p><a href="index.html">← back</a></p>
  </div>

</body>
