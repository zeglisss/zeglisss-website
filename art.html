<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Art — Sophia Zeglis</title>
  <link rel="stylesheet" href="main.css">
  <style>
    .art-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      align-items: start;
      gap: 1.25rem;
      padding: 0 1rem;
      max-width: 1400px;
      margin: 0 auto 4rem;
    }

    .art-piece {
      min-width: 0;
    }

    .art-piece button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }

    .art-piece img {
      width: 100%;
      height: auto;
      display: block;
    }

    .art-piece::after {
      content: attr(data-title) "\A" "Mixed-media collage. · " attr(data-date);
      display: block;
      margin-top: 0.45rem;
      color: #6c757d;
      font-size: 0.8rem;
      text-align: right;
      white-space: pre-line;
    }

    .art-piece button:focus-visible {
      outline: 2px solid #343a40;
      outline-offset: 4px;
    }

    .art-piece--small button {
      width: 75%;
      margin-left: auto;
      margin-right: auto;
    }

    .gallery-instruction {
      margin: 0 1rem 0.75rem;
      color: #6c757d;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-align: right;
      text-transform: uppercase;
    }

    .lightbox {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: rgba(255, 255, 255, 0.96);
    }

    .lightbox::backdrop {
      background: rgba(255, 255, 255, 0.96);
    }

    .lightbox-inner {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 4rem 3rem 3rem;
      box-sizing: border-box;
      text-align: center;
    }

    .lightbox img {
      width: auto;
      height: auto;
      max-width: calc((100vw - 6rem) * var(--zoom, 1));
      max-height: calc((100vh - 7rem) * var(--zoom, 1));
      object-fit: contain;
      vertical-align: middle;
    }

    .lightbox-close {
      position: fixed;
      top: 1rem;
      right: 1rem;
      border: 0;
      background: transparent;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
    }

    .zoom-controls {
      position: fixed;
      top: 1rem;
      left: 1rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: #6c757d;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .zoom-controls button {
      min-width: 2rem;
      padding: 0.2rem 0.45rem;
      border: 1px solid #d7d7d7;
      background: rgba(255, 255, 255, 0.9);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .zoom-level {
      min-width: 3.25rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      .art-gallery {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 0 0.5rem;
      }

      .lightbox-inner {
        padding: 4rem 1rem 1rem;
      }

      .lightbox img {
        max-width: calc((100vw - 2rem) * var(--zoom, 1));
        max-height: calc((100vh - 5rem) * var(--zoom, 1));
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="site-header">
    <h2>Sophia Zeglis</h2>
    <nav>
      <a href="index.html">home</a> / <a href="writings.html">writings</a> / <a href="readings.html">readings</a>
    </nav>
  </div>

  <!-- Section Header -->
  <div class="section-bar bar-subtle">
    <hr style="margin: 2.5rem 0 0.75rem 0;">
    <h6></h6>
  </div>
  <p class="gallery-instruction">Click to expand</p>
  <main class="art-gallery">
    <div class="art-piece" data-title="Scrap Collector" data-date="June 2026">
      <button type="button" data-full="images/art/scrap-collector-june-2026.jpg" aria-label="Expand Scrap Collector">
        <img src="images/art/scrap-collector-june-2026.jpg" alt="Scrap Collector" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="All Things Fall" data-date="Spring 2026">
      <button type="button" data-full="images/art/all-things-fall.jpg" aria-label="Expand All Things Fall">
        <img src="images/art/all-things-fall.jpg" alt="All Things Fall" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Faucet Castle Fire Escape" data-date="Spring 2026">
      <button type="button" data-full="images/art/faucet-castle-fire-escape.jpg" aria-label="Expand Faucet Castle Fire Escape">
        <img src="images/art/faucet-castle-fire-escape.jpg" alt="Faucet Castle Fire Escape" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Hand Throwing Fire and Tassel Hair" data-date="Spring 2026">
      <button type="button" data-full="images/art/hand-throwing-fire-and-tassel-hair.jpg" aria-label="Expand Hand Throwing Fire and Tassel Hair">
        <img src="images/art/hand-throwing-fire-and-tassel-hair.jpg" alt="Hand Throwing Fire and Tassel Hair" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Skylines and Blue Boat and Roads" data-date="Spring 2026">
      <button type="button" data-full="images/art/skylines-blue-boat-roads.jpg" aria-label="Expand Skylines and Blue Boat and Roads">
        <img src="images/art/skylines-blue-boat-roads.jpg" alt="Skylines and Blue Boat and Roads" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Woman Red and Black Lines Calendar" data-date="Spring 2026">
      <button type="button" data-full="images/art/woman-red-black-lines-calendar.jpg" aria-label="Expand Woman Red and Black Lines Calendar">
        <img src="images/art/woman-red-black-lines-calendar.jpg" alt="Woman Red and Black Lines Calendar" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Never Miss" data-date="Summer 2025">
      <button type="button" data-full="images/art/never-miss.jpg" aria-label="Expand Never Miss">
        <img src="images/art/never-miss.jpg" alt="Never Miss" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Texture Lilypad Sheep" data-date="Summer 2025">
      <button type="button" data-full="images/art/texture-lilypad-sheep.jpg" aria-label="Expand Texture Lilypad Sheep">
        <img src="images/art/texture-lilypad-sheep.jpg" alt="Texture Lilypad Sheep" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="The Enduring Horizon" data-date="Spring 2025">
      <button type="button" data-full="images/art/the-enduring-horizon.jpg" aria-label="Expand The Enduring Horizon">
        <img src="images/art/the-enduring-horizon.jpg" alt="The Enduring Horizon" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Drive" data-date="2025">
      <button type="button" data-full="images/art/drive.jpg" aria-label="Expand Drive">
        <img src="images/art/drive.jpg" alt="Drive" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Gallery" data-date="2025">
      <button type="button" data-full="images/art/gallery.jpg" aria-label="Expand Gallery">
        <img src="images/art/gallery.jpg" alt="Gallery" loading="lazy">
      </button>
    </div>
    <div class="art-piece" data-title="Greyscale Red" data-date="2025">
      <button type="button" data-full="images/art/greyscale-red.jpg" aria-label="Expand Greyscale Red">
        <img src="images/art/greyscale-red.jpg" alt="Greyscale Red" loading="lazy">
      </button>
    </div>
    <div class="art-piece art-piece--small" data-title="Heart I Know" data-date="2025">
      <button type="button" data-full="images/art/heart-i-know.jpg" aria-label="Expand Heart I Know">
        <img src="images/art/heart-i-know.jpg" alt="Heart I Know" loading="lazy">
      </button>
    </div>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Expanded artwork">
    <div class="zoom-controls" aria-label="Zoom controls">
      <button class="zoom-out" type="button" aria-label="Zoom out">−</button>
      <span class="zoom-level" aria-live="polite">100%</span>
      <button class="zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>
    <button class="lightbox-close" type="button" aria-label="Close expanded artwork">×</button>
    <div class="lightbox-inner">
      <img src="" alt="">
    </div>
  </dialog>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = lightbox.querySelector('img');
    const closeButton = lightbox.querySelector('.lightbox-close');
    const zoomInButton = lightbox.querySelector('.zoom-in');
    const zoomOutButton = lightbox.querySelector('.zoom-out');
    const zoomLevel = lightbox.querySelector('.zoom-level');
    let zoom = 1;

    function setZoom(nextZoom) {
      zoom = Math.min(3, Math.max(0.5, nextZoom));
      lightboxImage.style.setProperty('--zoom', zoom);
      zoomLevel.textContent = `${Math.round(zoom * 100)}%`;
      zoomOutButton.disabled = zoom <= 0.5;
      zoomInButton.disabled = zoom >= 3;
    }

    document.querySelectorAll('.art-piece button').forEach(button => {
      button.addEventListener('click', () => {
        const thumbnail = button.querySelector('img');
        lightboxImage.src = button.dataset.full;
        lightboxImage.alt = thumbnail.alt;
        setZoom(1);
        lightbox.showModal();
      });
    });

    zoomOutButton.addEventListener('click', () => setZoom(zoom - 0.25));
    zoomInButton.addEventListener('click', () => setZoom(zoom + 0.25));
    closeButton.addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) lightbox.close();
    });
  </script>

  <hr>

  <!-- Footer -->
  <div class="content-block text-muted">
    <p><a href="index.html">← back</a></p>
  </div>

</body>
</html>
